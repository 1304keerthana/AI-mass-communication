[project]
name = "ai-mass-communication-backend"
version = "0.1.0"
description = "Backend for AI-Based Multilingual Mass Communication Platform"
authors = ["AI Engineer <ai@example.com>"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.28.0",
    "python-jose>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "alembic==1.18.5",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.6"
]

[project.scripts]
start = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
